
general {
    colors = true
    interval = 3

    color_good = "#9ECE6A"
    color_degraded = "#E0AF68"
    color_bad = "#F7768E"

    separator = " | "
}

order += "wireless _first_"
order += "volume master"
order += "battery all"
order += "disk /"
order += "memory"
order += "load"
order += "tztime local"

wireless _first_ {
    format_up = "WIFI %essid"
    format_down = "WIFI OFF"
}

volume master {
    format = "VOL %volume"
    format_muted = "VOL MUTED"
    device = "default"
    mixer = "Master"
    mixer_idx = 0
}

battery all {
    format = "BAT %percentage"
    last_full_capacity = true
}

disk "/" {
    format = "SSD %avail"
}

memory {
    format = "RAM %used"
}

load {
    format = "CPU %1min"
}

tztime local {
    format = "%a %d %b  %H:%M"
}

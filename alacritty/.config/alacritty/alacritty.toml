[general]
live_config_reload = true
working_directory = "None"
import = [
# "~/.config/alacritty/tomorrownight.toml"
# "~/.config/alacritty/gruvbox-material-dark.toml"
]
[env]
TERM = "xterm-256color"

[window]
dynamic_padding = true
startup_mode = "Maximized"
# decorations = "full"
title = "Alacritty"
# opacity = 0.85
# padding = { x = 4, y = 2 }



[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 10000
multiplier = 3

# Default colors
# [colors.primary]
# background = '0x000000'
# Base16 Solarized Dark 256 - alacritty color config
# Ethan Schoonover (modified by aramisgithub)

# Default colors
[colors.primary]
background = '0x111111'
foreground = '0x93a1a1'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text = '0x002b36'
cursor = '0x93a1a1'

# Normal colors
[colors.normal]
black = '0x002b36'
red = '0xdc322f'
green = '0x859900'
yellow = '0xb58900'
blue = '0x268bd2'
magenta = '0x6c71c4'
cyan = '0x2aa198'
white = '0x93a1a1'

# Bright colors
[colors.bright]
black = '0x657b83'
red = '0xdc322f'
green = '0x859900'
yellow = '0xb58900'
blue = '0x268bd2'
magenta = '0x6c71c4'
cyan = '0x2aa198'
white = '0xfdf6e3'

[[colors.indexed_colors]]
index = 16
color = "0xcb4b16"

[[colors.indexed_colors]]
index = 17
color = "0xd33682"

[[colors.indexed_colors]]
index = 18
color = "0x073642"

[[colors.indexed_colors]]
index = 19
color = "0x586e75"

[[colors.indexed_colors]]
index = 20
color = "0x839496"

[[colors.indexed_colors]]
index = 21
color = "0xeee8d5"

[font]
size = 20

[font.normal]
family = "Hack Nerd Font Mono"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = "Block"
vi_mode_style = "None"
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = true

[[mouse.bindings]]
mouse = "Middle"
action = "PasteSelection"

[keyboard]
[[keyboard.bindings]]
key = "Paste"
action = "Paste"

[[keyboard.bindings]]
key = "Copy"
action = "Copy"

[[keyboard.bindings]]
key = "L"
mods = "Control"
action = "ClearLogNotice"

[[keyboard.bindings]]
key = "L"
mods = "Control"
mode = "~Vi"
chars = "\f"

[[keyboard.bindings]]
key = "PageUp"
mods = "Shift"
mode = "~Alt"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "PageDown"
mods = "Shift"
mode = "~Alt"
action = "ScrollPageDown"

[[keyboard.bindings]]
key = "Home"
mods = "Shift"
mode = "~Alt"
action = "ScrollToTop"

[[keyboard.bindings]]
key = "End"
mods = "Shift"
mode = "~Alt"
action = "ScrollToBottom"

[[keyboard.bindings]]
key = "V"
mods = "Control|Shift"
action = "Paste"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
action = "Copy"

[[keyboard.bindings]]
key = "F"
mods = "Control|Shift"
action = "SearchForward"

[[keyboard.bindings]]
key = "B"
mods = "Control|Shift"
action = "SearchBackward"

[[keyboard.bindings]]
key = "C"
mods = "Control|Shift"
mode = "Vi"
action = "ClearSelection"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"


[colors]
base00 = ee181616
base01 = 282727
base02 = 393836
base03 = 625e5a
base04 = 737c73
base05 = c5c9c5
base06 = c8c093
base07 = c5c9c5
base08 = c4746e
base09 = b6927b
base0A = c4b28a
base0B = 8a9a7b
base0C = 8ea4a2
base0D = 8ba4b0
base0E = a292a3
base0F = b98d7b

background     = ${colors.base00}
background-alt = ${colors.base01}
foreground     = ${colors.base05}
disabled       = ${colors.base03}
primary        = ${colors.base0D}
secondary      = ${colors.base0C}
alert          = ${colors.base08}
warning        = ${colors.base09}
success        = ${colors.base0B}

[bar/mybar]
width = 100%
; height = 24pt
bottom = true

dpi = 120

background = ${colors.background}
foreground = ${colors.foreground}

; line-size = 3pt

border-size = 0pt
; border-color = ${colors.base02}

padding-left = 0
padding-right = 0

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = Hack Nerd Font:size=7;2

modules-left = i3 xwindow
modules-right = filesystem pulseaudio memory cpu date battery systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 4pt
tray-spacing = 10pt
[module/i3]
type = internal/i3

label-focused = %name%
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.base00}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.base00}
label-urgent-padding = 1
[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %free% 

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = ""
format-volume-prefix-foreground = ${colors.primary}
format-volume =<ramp-volume> <label-volume>
ramp-volume-0 = 
ramp-volume-1 = 󰕾
ramp-volume-2 = 
label-volume = %percentage%%

label-muted = 
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "  "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-disconnected = %{F#707880}󰤭 Disconnected

[module/wlan]
inherit = network-base
interface-type = wireless

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨

label-connected = 

format-connected = <ramp-signal> <label-connected>
format-disconnected = <label-disconnected>

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %a %I:%M %p
date-alt = %A, %d %B %Y %I:%M:%S %p

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/battery]
type = internal/battery

battery = BAT0
adapter = ADP1

poll-interval = 5

full-at = 99
low-at = 10

time-format = %I:%M %p

;────────────────────────────
; Charging
;────────────────────────────
format-charging = <animation-charging> <label-charging>
label-charging = %percentage%%

;────────────────────────────
; Discharging
;────────────────────────────
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%% 

;────────────────────────────
; Full
;────────────────────────────
format-full = <label-full>
label-full = 󰁹 100%

;────────────────────────────
; Low Battery
;────────────────────────────
format-low = <animation-low> <label-low>
label-low = %percentage%%

;────────────────────────────
; Battery Icons
;────────────────────────────
ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰁹

;────────────────────────────
; Charging Animation
;────────────────────────────
animation-charging-0 = 󰢟
animation-charging-1 = 󰢜
animation-charging-2 = 󰂆
animation-charging-3 = 󰂇
animation-charging-4 = 󰂈
animation-charging-5 = 󰢝
animation-charging-6 = 󰂉
animation-charging-7 = 󰢞
animation-charging-framerate = 500

;────────────────────────────
; Low Battery Animation
;────────────────────────────
animation-low-0 = 󰂎
animation-low-1 =
animation-low-framerate = 300

[colors]
background = #16161e
background-alt = #16161e

; Monochrome
foreground = #d5d6db
foreground-muted = #787c99

accent-blue = #d5d6db
accent-green = #d5d6db
accent-yellow = #d5d6db
accent-red = #d5d6db
accent-purple = #d5d6db

transparent = #00000000


[bar/mybar]
width = 100%
; height = 18pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
border-size = 0

padding-left = 0
padding-right = 0
module-margin-left = 1
module-margin-right = 1

separator = ""
separator-foreground = ${colors.foreground-muted}

font-0 = Hack Nerd Font:style=Bold:size=9;2

modules-left = xworkspaces xwindow
modules-center =
modules-right = filesystem pulseaudio memory cpu wlan date systray

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3


; ==========================================================
; Workspaces
; ==========================================================

[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = false

label-active = %name%
label-active-foreground = ${colors.accent-blue}
label-active-underline = ${colors.accent-blue}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${colors.accent-blue}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.accent-red}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.foreground-muted}
label-empty-padding = 1


; ==========================================================
; Window title
; ==========================================================

[module/xwindow]
type = internal/xwindow

label =   %class%
label-foreground = ${colors.foreground-muted}


; ==========================================================
; Filesystem
; ==========================================================

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /

format-mounted = <label-mounted>
label-mounted = "   %percentage_used%%"
label-mounted-foreground = ${colors.accent-yellow}


; ==========================================================
; Audio
; ==========================================================

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>

label-volume = "%percentage%%"
label-volume-foreground = ${colors.accent-green}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.accent-green}

label-muted = 
label-muted-foreground = ${colors.foreground-muted}

click-right = pavucontrol


; ==========================================================
; RAM
; ==========================================================

[module/memory]
type = internal/memory
interval = 2

format = <label>
label = "   %percentage_used%%"
label-foreground = ${colors.accent-purple}


; ==========================================================
; CPU
; ==========================================================

[module/cpu]
type = internal/cpu
interval = 2

format = <label>
label = "   %percentage%%"
label-foreground = ${colors.accent-purple}


; ==========================================================
; Network
; ==========================================================

[network-base]
type = internal/network
interval = 5

format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-disconnected = " 󰤭 "
label-disconnected-foreground = ${colors.foreground-muted}


[module/wlan]
inherit = network-base
interface-type = wireless

label-connected = "   %essid%"
label-connected-foreground = ${colors.accent-blue}


[module/eth]
inherit = network-base
interface-type = wired

label-connected = "󰈀 "
label-connected-foreground = ${colors.accent-blue}


; ==========================================================
; Clock
; ==========================================================

[module/date]
type = internal/date
interval = 1

date = %a %d %b  %H:%M
date-alt = %Y-%m-%d  %H:%M:%S

label =   %date%
label-foreground = ${colors.accent-yellow}


; ==========================================================
; Tray
; ==========================================================

[module/systray]
type = internal/tray

format-margin = 1
tray-spacing = 6px


; ==========================================================
; Settings
; ==========================================================

[settings]
screenchange-reload = true
pseudo-transparency = true

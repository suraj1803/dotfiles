#################################
# Minimal Picom Configuration
#################################

# Backend
backend = "glx";

# VSync
vsync = true;

#################################
# Shadows
#################################

shadow = false;
shadow-radius = 8;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-opacity = 0.25;

# Don't shadow these
shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Waybar'"
];

fading = true;

# fade-in-step = 1.00;
# fade-out-step = 1.00;
fade-delta = 1;

# Don't fade terminal windows
# focus-exclude = [
#     "class_g = 'kitty'"
# ];

#################################
# Opacity
#################################

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Keep transparent applications transparent
inactive-opacity-override = false;

#################################
# Blur
#################################

# Disable blur for minimal setup
blur-method = "none";

#################################
# Window detection
#################################

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

#################################
# Misc
#################################

mark-wmwin-focused = true;
mark-ovredir-focused = true;

use-ewmh-active-win = true;

# Avoid fading fullscreen applications
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 1.0; focus = true; full-shadow = false; };
    dock = { shadow = false; fade = false; };
    dnd = { shadow = false; fade = false; };
    popup_menu = { opacity = 1.0; fade = true; };
    dropdown_menu = { opacity = 1.0; fade = true; };
};

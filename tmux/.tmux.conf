set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ga terminal-features ",xterm-kitty:RGB"
set -ga terminal-features ",xterm-ghostty:RGB"

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf \; display-message "Config Reloaded"

bind j resize-pane -D 2
bind k resize-pane -U 2
bind h resize-pane -L 2
bind l resize-pane -R 2

bind -r m resize-pane -Z
set -g mouse on
set -g set-clipboard external

setw -g mode-keys vi
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'jimeh/tmux-themepack'
# set -g @themepack 'powerline/default/cyan'
# Minimal Black Solarized Theme

set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @tokyo-night-tmux_theme night   # night (default) | storm | moon | day
set -g @tokyo-night-tmux_transparent 1 # transparent background
set -g @tokyo-night-tmux_show_git 1             # local git status
set -g @tokyo-night-tmux_show_path 1            # current path
set -g @tokyo-night-tmux_show_hostname 1        # machine hostname

# Optional: reorder the right status bar (default order shown)
# set -g @tokyo-night-tmux_show_right_widgets "path, git, datetime"
set -g @plugin 'tmux-plugins/tmux-resurrect'
run '~/.tmux/plugins/tpm/tpm'

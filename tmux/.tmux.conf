set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ga terminal-features ",xterm-kitty:RGB"
set -ga terminal-features ",xterm-ghostty:RGB"

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.tmux.conf \; display-message "Config Reloaded"

bind j resize-pane -D 2
bind k resize-pane -U 2
bind h resize-pane -L 2
bind l resize-pane -R 2

bind -r m resize-pane -Z

set -g mouse on
set -g set-clipboard external
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'jimeh/tmux-themepack'
# set -g @themepack 'powerline/default/cyan'
# Minimal Black Solarized Theme

# Status bar
set -g status-style "bg=#0a0a0a,fg=#839496"
set -g status-left-length 30
set -g status-right-length 100
set -g status-left "#[fg=#2aa198]#S #[fg=#586e75]"
set -g status-right "#[fg=#0087d7]%a %h-%d %H:%M #[fg=#859900]#h"

# Window list
setw -g window-status-format "#[fg=#586e75] #I #[fg=#839496]#W"
setw -g window-status-current-format "#[fg=#268bd2,bold]#I #[fg=#b58900]#W"
setw -g window-status-separator " "

# Pane borders
set -g pane-border-style "fg=#222222"
set -g pane-active-border-style "fg=#268bd2"

# Message colors
set -g message-style "bg=#0a0a0a,fg=#2aa198"
set -g message-command-style "bg=#0a0a0a,fg=#b58900"

# Window mode
setw -g mode-style "bg=#268bd2,fg=#0a0a0a"

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

run '~/.tmux/plugins/tpm/tpm'

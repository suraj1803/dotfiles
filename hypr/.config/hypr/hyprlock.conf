# ==========================================================================
# HYPRLOCK — Obsidian & Starlight Lockscreen
# ==========================================================================

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

background {
    monitor =
    path = ~/Pictures/photo_2026-11-12_22-30-25.jpg
    color = rgba(4, 5, 7, 1.0)
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 1.05
    brightness = 0.68
    vibrancy = 0.20
}

# Time
label {
    monitor =
    text = $TIME
    color = rgba(238, 242, 247, 0.96)
    font_size = 76
    font_family = JetBrainsMono Nerd Font Propo Bold
    position = 0, 110
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(152, 178, 201, 0.85)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Propo Medium
    position = 0, 34
    halign = center
    valign = center
}

# Password Capsule
input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    dots_size = 0.24
    dots_spacing = 0.28
    dots_center = true
    rounding = 10
    outer_color = rgba(49, 59, 77, 0.95)
    inner_color = rgba(11, 13, 18, 0.88)
    font_color = rgba(238, 242, 247, 0.95)
    check_color = rgba(152, 178, 201, 0.95)
    fail_color = rgba(224, 108, 117, 0.95)
    fade_on_empty = false
    placeholder_text = <span foreground="##7f8a9c">Enter Password</span>
    fail_text = <span foreground="##e06c75">Authentication Failed</span>
    position = 0, -56
    halign = center
    valign = center
}

# ==========================================================================
# HYPRIDLE — Auto-Dim, Auto-Lock (Hyprlock), DPMS & Auto-Suspend
# ==========================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
    inhibit_sleep = 3
}

# 1. Dim screen after 2.5 minutes of inactivity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 2. Lock session after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Turn off display 30 seconds after locking (5.5 minutes)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")' && brightnessctl -r
}

# 4. Automatically suspend laptop/PC after 10 minutes of inactivity
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
